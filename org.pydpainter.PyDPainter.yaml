app-id: org.pydpainter.PyDPainter
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: pydpainter
finish-args:
  - --socket=x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=xdg-pictures
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /lib/python3.*/site-packages/pygame/docs
  - /lib/python3.*/site-packages/pygame/examples
  - /lib/python3.*/site-packages/pygame/tests
  - /lib/python3.*/site-packages/numpy/tests/
  - /lib/python3.*/site-packages/numpy/*/tests/
  - /man
  - /share/man
modules:
  - shared-modules/SDL2/SDL2_image.json
  - shared-modules/SDL2/SDL2_ttf.json
  - tkinter.json

  - name: portmidi
    buildsystem: cmake
    sources:
      - type: git
        url: https://github.com/PortMidi/portmidi.git
        tag: v2.0.8
        commit: 101dac9455e2718512c94e24cbcae6a6f34b908b

  - python3-requirements.yaml

  - name: pydpainter
    buildsystem: simple
    build-commands:
      - install -Dm 755 run.sh ${FLATPAK_DEST}/bin/pydpainter
      - install -Dm 755 PyDPainter.py ${FLATPAK_DEST}/share/pydpainter/PyDPainter.py
      - cp -a data gif2numpy iff_pics libs logo ${FLATPAK_DEST}/share/pydpainter
      - install -Dm 644 logo/logo128.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/${FLATPAK_ID}.png
      - install -Dm 644 ${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm 644 ${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      - type: git
        url: https://github.com/mriale/PyDPainter.git
        tag: v2.2.1
        commit: 6f018f1d9934543297eb6983a19950b6c791770a
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - type: file
        path: run.sh
      - type: file
        path: org.pydpainter.PyDPainter.metainfo.xml
      - type: file
        path: org.pydpainter.PyDPainter.desktop
